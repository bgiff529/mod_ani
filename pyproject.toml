[build-system]
requires = ["setuptools>=75.6", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mod-ani"
version = "0.1.0"
description = "Electron-aware modifications to ANI-style neural network potentials."
requires-python = ">=3.12"
dependencies = [
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
